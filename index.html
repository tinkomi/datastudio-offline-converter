  <style>
    :root {
      --bg: #0b0f19;
      --surface: #111827;
      --surface-card: #1a2234;
      --border: #2d3748;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --accent: #10b981;
      --text: #f9fafb;
      --text-muted: #9ca3af;
      --code-bg: #080c14;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "JetBrains Mono", monospace, sans-serif; }
    body { background-color: var(--bg); color: var(--text); min-height: 100vh; padding: 20px; }
    .container { max-width: 1200px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 18px; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
    .logo { font-size: 20px; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 10px; }
    .badge { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: rgba(59, 130, 246, 0.2); color: #60a5fa; border: 1px solid var(--primary); }
    .lang-switcher { display: flex; align-items: center; gap: 6px; }
    .lang-select { background: #111827; border: 1px solid var(--border); color: #fff; padding: 6px 10px; border-radius: 6px; font-size: 12px; cursor: pointer; outline: none; }
    .lang-select:focus { border-color: var(--primary); }
    
    .pro-banner { background: linear-gradient(135deg, rgba(59, 130, 246, 0.15), rgba(16, 185, 129, 0.15)); border: 1px solid rgba(59, 130, 246, 0.4); border-radius: 8px; padding: 12px 18px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
    .pro-banner p { font-size: 13px; color: #e5e7eb; }
    .pro-btn { background: linear-gradient(135deg, #3b82f6, #10b981); color: #fff; text-decoration: none; padding: 6px 14px; border-radius: 6px; font-size: 12px; font-weight: 600; transition: opacity 0.2s; white-space: nowrap; }
    .pro-btn:hover { opacity: 0.9; }
    
    .toolbar { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
    .btn { background: var(--surface-card); color: var(--text); border: 1px solid var(--border); padding: 8px 14px; border-radius: 6px; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: all 0.2s; }
